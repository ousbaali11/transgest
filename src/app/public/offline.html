<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TransGest — Hors ligne</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-family: -apple-system, system-ui, sans-serif;
      background: #F6F4EF;
      color: #1B2430;
      text-align: center;
      padding: 24px;
    }
    .emoji { font-size: 48px; }
    h1 { font-size: 18px; margin: 0; }

      margin-top: 8px;
      background: #16305B;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

<body>
  <span class="emoji">🚛</span>
  <h1>Pas de connexion</h1>
  <p>TransGest a besoin d'internet pour afficher vos voyages, dépenses et factures à jour.</p>
  <button onclick="location.reload()">Réessayer</button>

</html>
